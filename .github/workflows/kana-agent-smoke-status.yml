name: Kana Agent Smoke Status

on:
  push:
    branches:
      - fix/kana-agent-observability

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Mark smoke test pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=kana-agent-smoke \
            -f description='Kana headless smoke test is running'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Kana
        run: |
          set -euo pipefail
          kana_home="$RUNNER_TEMP/kana-home"
          mkdir -p "$kana_home"
          echo "KANA_HOME=$kana_home" >> "$GITHUB_ENV"
          printf '%s\n' \
            '[model.deepseek]' \
            'name = "deepseek-v4-flash"' \
            'reasoning_effort = "max"' \
            '' \
            '[agent]' \
            'max_turns = 4' \
            '' \
            '[memory]' \
            'enabled = false' \
            '' \
            '[notification]' \
            'backend = "off"' \
            'on_agent_completed = false' \
            'on_approval_required = false' \
            > "$kana_home/config.toml"

      - name: Run Kana smoke test
        id: kana_smoke
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          printf 'Reply with exactly OK. Do not use tools.\n' | \
            bun src/main.ts exec --json > "$RUNNER_TEMP/kana-smoke.jsonl"
          exit_code=$?
          set -e

          outcome="$(jq -r 'select(.type == "run.completed") | .outcome' "$RUNNER_TEMP/kana-smoke.jsonl" 2>/dev/null | tail -n 1 || true)"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "outcome=${outcome:-missing}" >> "$GITHUB_OUTPUT"

          if [[ "$exit_code" == "0" && "$outcome" == "stop" ]]; then
            exit 0
          fi
          exit 1

      - name: Publish smoke result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_RESULT: ${{ steps.kana_smoke.outcome }}
          EXIT_CODE: ${{ steps.kana_smoke.outputs.exit_code }}
          OUTCOME: ${{ steps.kana_smoke.outputs.outcome }}
        run: |
          if [[ "$SMOKE_RESULT" == "success" ]]; then
            state=success
            description="Kana smoke passed: outcome=${OUTCOME:-stop}"
          else
            state=failure
            description="Kana smoke failed: exit=${EXIT_CODE:-unknown}, outcome=${OUTCOME:-unknown}"
          fi

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=kana-agent-smoke \
            -f description="$description"
