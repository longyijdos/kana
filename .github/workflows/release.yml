name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check release metadata
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          package_version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          expected_tag="v$package_version"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version." >&2
            echo "Expected tag: $expected_tag" >&2
            exit 1
          fi
          if [[ ! -f CHANGELOG.md ]] && gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "event=release_metadata_legacy tag=$RELEASE_TAG outcome=existing_release_notes"
          elif [[ ! -f CHANGELOG.md ]] || ! grep -Fq "## [$package_version]" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a release section for $package_version." >&2
            exit 1
          fi
      - run: bun run check

  build:
    name: Build ${{ matrix.asset }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: kana-darwin-arm64
            target: bun-darwin-arm64
          - asset: kana-darwin-x64
            target: bun-darwin-x64
          - asset: kana-linux-arm64
            target: bun-linux-arm64
          - asset: kana-linux-x64
            target: bun-linux-x64-baseline
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun build --compile --define __KANA_DISTRIBUTION__='"direct"' --target=${{ matrix.target }} --outfile=dist/${{ matrix.asset }} src/main.ts
      - run: cd dist && sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Prepare release notes
        run: |
          release_version="${RELEASE_TAG#v}"
          release_heading="## [$release_version]"
          if [[ -f CHANGELOG.md ]]; then
            # A generated section ends at the next version heading; keep all subheadings in its body.
            awk -v heading="$release_heading" '
              index($0, heading) == 1 { found = 1; next }
              found && index($0, "## [") == 1 { exit }
              found { print }
              END {
                if (!found) {
                  print "Changelog entry not found for " heading > "/dev/stderr"
                  exit 1
                }
              }
            ' CHANGELOG.md > release-notes.md
          else
            # Tags published before CHANGELOG adoption retain their existing GitHub Release notes on reruns.
            gh release view "$RELEASE_TAG" --json body --jq .body > release-notes.md
            echo "event=release_notes_preserved tag=$RELEASE_TAG outcome=legacy_release"
          fi
          if [[ ! -s release-notes.md ]]; then
            echo "Changelog release section for $release_version is empty." >&2
            exit 1
          fi
          echo "event=release_notes_prepared version=$release_version outcome=success"
      - name: Publish release
        run: |
          echo "event=release_publish_started tag=$RELEASE_TAG repository=$GH_REPO"
          ls -lh dist/
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "event=release_publish_existing tag=$RELEASE_TAG"
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            echo "event=release_publish_creating tag=$RELEASE_TAG"
            gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          echo "event=release_publish_completed tag=$RELEASE_TAG outcome=success"
