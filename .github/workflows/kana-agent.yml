name: Kana Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  kana:
    uses: ./.github/workflows/kana-agent-reusable.yml
    with:
      config-path: .github/kana/config.toml
      custom-provider-path: .github/kana/providers/custom.toml
      setup-script-path: .github/kana/setup.sh
      preflight-command: bun run check:write
    secrets:
      KANA_GITHUB_TOKEN: ${{ secrets.KANA_GITHUB_TOKEN }}
      KANA_MODEL_API_KEY: ${{ secrets.KANA_MODEL_API_KEY }}
